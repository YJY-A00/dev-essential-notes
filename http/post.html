<!DOCTYPE html>
<html>
<head>
    <title>POST 请求测试</title>
</head>
<body>
    <h1>POST 请求测试</h1>
    <button onclick="sendPost()">点我发送 POST 请求</button>

    <script>
        function sendPost() {
            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: '我的测试文章',
                    body: '这是通过POST新增的内容',
                    userId: 1
                })
            })
            .then(response => response.json())
            .then(data => {
                alert('POST 成功！服务器返回了 ID：' + data.id);
            })
            .catch(error => {
                alert('请求失败：' + error);
            });
        }
    </script>
</body>
</html>
